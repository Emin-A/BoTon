<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoTon — Отчёт по заданиям</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: #666;
            font-size: 14px;
        }

        .header .date {
            display: inline-block;
            background: #f0f0f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            margin-top: 10px;
        }

        .doctor-name {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            margin-top: 8px;
        }

        .patient-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        .patient-card:hover {
            transform: translateY(-2px);
        }

        .patient-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .patient-number {
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .patient-name {
            font-weight: 600;
            font-size: 16px;
            color: #222;
        }

        .patient-id {
            font-size: 12px;
            color: #999;
            margin-left: auto;
        }

        .task-list {
            margin-left: 44px;
        }

        .task-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-title {
            font-size: 14px;
            color: #444;
            margin-bottom: 8px;
        }

        .task-title .task-letter {
            display: inline-block;
            background: #e8e8e8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-done {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
        }

        .btn-done:hover {
            background: #c8e6c9;
        }

        .btn-done.selected {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .btn-failed {
            background: #ffebee;
            color: #c62828;
            border-color: #ffcdd2;
        }

        .btn-failed:hover {
            background: #ffcdd2;
        }

        .btn-failed.selected {
            background: #c62828;
            color: white;
            border-color: #c62828;
        }

        .btn-not-started {
            background: #fff3e0;
            color: #e65100;
            border-color: #ffe0b2;
        }

        .btn-not-started:hover {
            background: #ffe0b2;
        }

        .btn-not-started.selected {
            background: #e65100;
            color: white;
            border-color: #e65100;
        }

        .submit-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .progress {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .progress-bar {
            background: #f0f0f0;
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #1565c0;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 20px;
            }

            .btn {
                min-width: 100px;
                padding: 8px 12px;
                font-size: 13px;
            }

            .task-list {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Отчёт по заданиям</h1>
            <div class="subtitle">Отметьте статус выполнения по каждому пациенту</div>
            <div class="date" id="currentDate"></div>
            <div class="doctor-name" id="doctorName"></div>
        </div>

        <div class="info-box">
            💡 Нажмите на кнопку напротив каждого задания. Что не отмечено — будет считаться «Не выполнено».
        </div>

        <div id="patientsContainer"></div>

        <div class="submit-section">
            <button class="submit-btn" id="submitBtn" onclick="submitReport()">
                📤 Отправить отчёт
            </button>
            <div class="progress">
                Отмечено: <span id="progressText">0 из 0</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Данные встраиваются при генерации файла
        const BOTON_ID = "{{BOTON_ID}}";
        const DOCTOR_NAME = "{{DOCTOR_NAME}}";
        const DATE = "{{DATE}}";
        const PATIENTS = {{PATIENTS_JSON}};

        const answers = {};

        function init() {
            document.getElementById('currentDate').textContent = DATE;
            document.getElementById('doctorName').textContent = DOCTOR_NAME;
            renderPatients();
            updateProgress();
        }

        function renderPatients() {
            const container = document.getElementById('patientsContainer');
            container.innerHTML = '';

            PATIENTS.forEach(patient => {
                const card = document.createElement('div');
                card.className = 'patient-card';

                let tasksHtml = '';
                patient.tasks.forEach(task => {
                    const letterBadge = task.letter ? `<span class="task-letter">${task.letter}</span>` : '';
                    tasksHtml += `
                        <div class="task-item">
                            <div class="task-title">
                                ${letterBadge}${task.title}
                            </div>
                            <div class="buttons">
                                <button class="btn btn-done" onclick="selectStatus('${task.key}', 'done', this)">
                                    ✓ Отработано
                                </button>
                                <button class="btn btn-failed" onclick="selectStatus('${task.key}', 'failed', this)">
                                    ✗ Не состоялась
                                </button>
                                <button class="btn btn-not-started" onclick="selectStatus('${task.key}', 'not_started', this)">
                                    ⚠ Не выполнено
                                </button>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="patient-header">
                        <div class="patient-number">${patient.number}</div>
                        <div class="patient-name">${patient.name}</div>
                        <div class="patient-id">ОМС: ${patient.id}</div>
                    </div>
                    <div class="task-list">
                        ${tasksHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function selectStatus(taskKey, status, button) {
            answers[taskKey] = status;

            const taskItem = button.closest('.task-item');
            taskItem.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('selected');
            });

            button.classList.add('selected');
            updateProgress();
        }

        function updateProgress() {
            const totalTasks = PATIENTS.reduce((sum, p) => sum + p.tasks.length, 0);
            const markedTasks = Object.keys(answers).length;
            const percentage = totalTasks > 0 ? (markedTasks / totalTasks) * 100 : 0;

            document.getElementById('progressText').textContent = `${markedTasks} из ${totalTasks}`;
            document.getElementById('progressFill').style.width = `${percentage}%`;
        }

        function submitReport() {
            if (Object.keys(answers).length === 0) {
                alert('Пожалуйста, отметьте хотя бы одно задание');
                return;
            }

            let body = `BOTON-ID: ${BOTON_ID}\n\n`;
            body += 'Ответы по заданиям:\n\n';

            PATIENTS.forEach(patient => {
                patient.tasks.forEach(task => {
                    const status = answers[task.key];
                    let statusText = '[ ]';
                    if (status === 'done') statusText = '[x]';
                    else if (status === 'failed') statusText = '[x]';
                    else if (status === 'not_started') statusText = '[ ]';

                    let statusLabel = '';
                    if (status === 'done') statusLabel = 'отработано';
                    else if (status === 'failed') statusLabel = 'консультация не состоялась';
                    else if (status === 'not_started') statusLabel = 'не выполнено';

                    body += `${statusText} ${task.key} — ${statusLabel}\n`;
                });
            });

            const encodedBody = encodeURIComponent(body);
            const subject = encodeURIComponent(`Re: Задания для пациентов на ${DATE} [BOTON-ID:${BOTON_ID}]`);
            const toEmail = 'agaverdiev@yandex.ru';

            window.location.href = `mailto:${toEmail}?subject=${subject}&body=${encodedBody}`;

            setTimeout(() => {
                alert('Почтовый клиент открыт. Нажмите "Отправить" в вашем почтовом приложении.');
            }, 500);
        }

        init();
    </script>
</body>
</html>
