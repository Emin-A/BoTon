name: BoTon - Рассылка заданий

on:
  workflow_dispatch:
    inputs:
      force_resend:
        description: 'Повторная отправка (FORCE_RESEND)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      test_to_reserve:
        description: 'Тестовый режим (TEST_TO_RESERVE)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  send-assignments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > credentials.json

      - name: Run BoTon
        run: python main.py
        env:
          FORCE_RESEND: ${{ github.event.inputs.force_resend }}
          TEST_TO_RESERVE: ${{ github.event.inputs.test_to_reserve }}
