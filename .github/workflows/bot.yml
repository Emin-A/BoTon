name: BoTon - Рассылка заданий

on:
  workflow_dispatch:
    inputs:
      force_resend:
        description: 'Повторная отправка (FORCE_RESEND)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      test_to_reserve:
        description: 'Тестовый режим (TEST_TO_RESERVE)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

  # ДЕЖУРНЫЙ РЕЖИМ: 3 запуска в день вместо 288.
  # Каждый запуск сам проверяет таблицу каждые 5 минут и ЗАВЕРШАЕТСЯ
  # сразу после рассылки. Если всё уже отправлено — выходит за секунды.
  schedule:
    - cron: '0 4 * * *'    # 07:00 МСК — утреннее дежурство
    - cron: '0 10 * * *'   # 13:00 МСК — дневное (подхватит новые строки)
    - cron: '0 16 * * *'   # 19:00 МСК — вечернее

# Новое дежурство заменяет предыдущее, очередь не копится.
concurrency:
  group: boton-send
  cancel-in-progress: true

jobs:
  send-assignments:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > credentials.json

      - name: Run BoTon
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"
          FORCE_RESEND: ${{ github.event.inputs.force_resend || 'false' }}
          TEST_TO_RESERVE: ${{ github.event.inputs.test_to_reserve || 'false' }}
          POEM_API_KEY: ${{ secrets.POEM_API_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          RESERVE_EMAILS: ${{ secrets.RESERVE_EMAILS }}
          TASKS_SPREADSHEET_ID: ${{ secrets.TASKS_SPREADSHEET_ID }}
          DOCTORS_SPREADSHEET_ID: ${{ secrets.DOCTORS_SPREADSHEET_ID }}
          LOG_SPREADSHEET_ID: ${{ secrets.LOG_SPREADSHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
