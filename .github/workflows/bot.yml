name: BoTon - Рассылка заданий

on:
  # Ручной запуск с кнопками (Actions → Run workflow)
  workflow_dispatch:
    inputs:
      force_resend:
        description: 'Повторная отправка (FORCE_RESEND)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      test_to_reserve:
        description: 'Тестовый режим (TEST_TO_RESERVE)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

  # Автозапуск каждые 15 минут с 07:00 до 23:00 МСК каждый день
  # 04:00-20:00 UTC = 07:00-23:00 МСК
  schedule:
    - cron: '*/15 4-20 * * *'

jobs:
  send-assignments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > credentials.json

      - name: Run BoTon
        run: python main.py
        env:
          FORCE_RESEND: ${{ github.event.inputs.force_resend || 'false' }}
          TEST_TO_RESERVE: ${{ github.event.inputs.test_to_reserve || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}

      - name: Test SMTP
      run: python test_smtp.py
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
       SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
